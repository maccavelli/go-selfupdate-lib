name: CI
on:
  push:
    # A release branch's commit is tested before it is tagged
    # (docs/decisions/0018-MADR-move-toolchain-to-go-1-27-2.md).
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:

# The token is read-only: CI fetches and runs tools (markdownlint, actionlint),
# and needs no write access
# (docs/decisions/0010-MADR-remediate-second-debugging-pass-findings.md D7).
permissions:
  contents: read

# One run per ref: a newer push, or a duplicate trigger for the same one,
# cancels the older run
# (docs/decisions/0003-MADR-remediate-debugging-pass-findings.md D11).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      # The Linux leg fetches every commit and tag: the API gate compares
      # with the newest v1.* tag (0004-PLAN-v1-1-0-core-api.md Step 12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ runner.os == 'Linux' && '0' || '1' }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod download
      # The installer tests must reach each shell the runner has: both
      # PowerShells on Windows
      # (docs/decisions/0014-PLAN-shared-installer-templates.md I4).
      - run: go test ./...
        env:
          SELFUPDATE_INSTALL_REQUIRE_SHELLS: ${{ runner.os == 'Windows' && 'powershell,pwsh' || runner.os == 'Linux' && 'dash,bash' || 'sh,bash' }}
      # Giving staging another owner needs root. The test binary is built as
      # the runner, so root writes nothing to the Go caches, and only it runs
      # under sudo; SELFUPDATE_REQUIRE_ROOT makes a skip a failure
      # (docs/decisions/0010-PLAN-v1-6-0-owner-contracts.md S6).
      - name: ownership as root
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -c -o "$RUNNER_TEMP/selfupdate.test" ./selfupdate
          sudo env SELFUPDATE_REQUIRE_ROOT=1 "$RUNNER_TEMP/selfupdate.test" \
            -test.run '^TestStagingTakesOwnerAsRoot$' -test.count=1 -test.v
      # The systemd backend against the runner's real systemd: a throwaway
      # unit in system scope under sudo, then in the runner user's own
      # manager. The binary is built as the runner, as above
      # (docs/decisions/0011-PLAN-reference-service-lifecycles.md V2).
      - name: systemd live test
        if: runner.os == 'Linux'
        shell: bash
        run: |
          go test -c -o "$RUNNER_TEMP/systemd.test" ./selfupdate/service/systemd
          sudo env SELFUPDATE_REQUIRE_SYSTEMD=1 FAKE_LIVE_ROOT=/var/tmp \
            "$RUNNER_TEMP/systemd.test" -test.run '^TestLive' -test.count=1 -test.v
          env SELFUPDATE_REQUIRE_SYSTEMD=1 SELFUPDATE_SYSTEMD_SCOPE=user FAKE_LIVE_ROOT=/var/tmp \
            XDG_RUNTIME_DIR="/run/user/$(id -u)" \
            "$RUNNER_TEMP/systemd.test" -test.run '^TestLive' -test.count=1 -test.v
      # The launchd live test: a throwaway KeepAlive LaunchAgent in the
      # runner user's GUI domain, which needs its login session ("Aqua")
      # (docs/decisions/0011-PLAN-reference-service-lifecycles.md V3).
      - name: launchd live test
        if: runner.os == 'macOS'
        env:
          SELFUPDATE_REQUIRE_LAUNCHD: "1"
        run: go test -count=1 -v -run '^TestLive' ./selfupdate/service/launchd
      # The codesign live test: ad-hoc signing and signature checks with the
      # runner's /usr/bin/codesign. No certificate identity is set here, so
      # TestLiveSignIdentity skips
      # (docs/decisions/0012-PLAN-archive-assets-and-macos-codesign.md U4).
      - name: codesign live test
        if: runner.os == 'macOS'
        env:
          SELFUPDATE_REQUIRE_CODESIGN: "1"
        run: go test -count=1 -v -run '^TestLive' ./selfupdate/codesign
      # The SCM live test: a throwaway service the test creates and deletes,
      # which needs the runner's administrator session
      # (docs/decisions/0011-PLAN-reference-service-lifecycles.md V4).
      - name: SCM live test
        if: runner.os == 'Windows'
        env:
          SELFUPDATE_REQUIRE_SCM: "1"
        run: go test -count=1 -v -run '^TestLive' ./selfupdate/service/scm
      # The race detector needs cgo, which the Linux and macOS runners have
      # (0003-MADR D9; 0002-PLAN V3; 0004-MADR H7).
      # The manifest differential must run, not skip, where python3 is on
      # PATH; the Windows runner names it python
      # (0004-PLAN-h2-fuzzing-and-manifest-differential.md Step 3).
      - name: go test -race
        if: runner.os != 'Windows'
        env:
          SELFUPDATE_REQUIRE_PYTHON: "1"
        run: go test -race -count=1 ./...
      # Order-dependent tests fail here (0004-MADR H7).
      - name: go test -shuffle
        if: runner.os == 'Linux'
        run: go test -shuffle=on -count=2 ./...
      # Each fuzz target for 20 s; a failing input is kept as an artifact
      # (0004-PLAN-h2-fuzzing-and-manifest-differential.md Step 4).
      - name: fuzz
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./scripts/go-fuzz_test.sh
          make fuzz
      - name: fuzz corpus
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus
          path: |
            selfupdate/testdata/fuzz/
            selfupdate/archive/testdata/fuzz/
            selfupdate/releasespec/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14
      # Targets the matrix does not run: a build-tag gap fails here
      # (0004-MADR H7).
      - name: cross go vet
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for target in freebsd/amd64 openbsd/amd64 linux/386; do
            echo "go vet ($target)"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
          done
      # gofmt's list is read through an assignment, which fails under the
      # step's bash -e when gofmt itself fails; `test -z "$(gofmt -l .)"`
      # passed then
      # (docs/decisions/0020-MADR-precheck-gofmt-errors-and-replace-before-stop.md).
      - name: vet, gofmt, tidy, lint
        if: runner.os == 'Linux'
        run: |
          go vet ./...
          unformatted="$(gofmt -l .)"
          test -z "$unformatted"
          go mod tidy -diff
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint" make lint
      # apidiff exits 0 on an incompatible change, so the gate reads its
      # report; its own test plants a removal in a scratch clone. On a tag
      # push the base is that tag, which compares the tree with itself
      # (0004-PLAN-v1-1-0-core-api.md Step 12).
      - name: API compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          make apicheck
          ./scripts/check-api-compat_test.sh
      - name: govulncheck
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      # Scripts, Markdown and workflows are checked as the pre-add gate and
      # the records require (0003-MADR D9).
      # shellcheck is pinned to the release the pre-add hosts use (the
      # latest), checksum-verified, and first on PATH so actionlint's
      # embedded checks use it too. The runner's distribution copy is older
      # and reports differently (0003-PLAN deviation D5).
      - name: shellcheck, markdownlint, actionlint
        if: runner.os == 'Linux'
        shell: bash
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}:$PATH"
          shellcheck --version
          shellcheck scripts/*.sh
          # The installer templates: shellcheck and dash -n, and
          # PSScriptAnalyzer under the runner's pwsh
          # (docs/decisions/0014-PLAN-shared-installer-templates.md I5).
          ./scripts/check-installers_test.sh
          ./scripts/check-installers.sh internal/cmd/selfupdate-release/installer/install.sh \
            internal/cmd/selfupdate-release/installer/install.ps1
          npx --yes markdownlint-cli2@0.23.2
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # The reusable release workflow's own tests
      # (docs/decisions/0002-MADR-rehome-selfupdate-from-mcplib.md §6).
      - name: verify self-update release fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/verify-selfupdate-release_test.sh
      - name: Verify the release guard
        shell: bash
        run: ./scripts/refuse-existing-release_test.sh
      # The release tag rule and the workflow's use of it
      # (docs/decisions/0005-PLAN-opt-in-prerelease-channels.md Step 6).
      - name: Verify the release tag rule
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/check-release-tag_test.sh
      # The release workflow's latest-flag rule: a backport below the current
      # latest is not made latest
      # (docs/decisions/0010-MADR-remediate-second-debugging-pass-findings.md D9).
      - name: Verify the latest-release rule
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/release-latest-flag_test.sh
      # The pre-add gate's own test: a deletion still checks its package, and
      # an unreachable vulnerability database fails
      # (docs/decisions/0010-MADR-remediate-second-debugging-pass-findings.md D3, D4).
      - name: Verify the pre-add gate
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/go-precheck_test.sh
      # The full gate's own test, the document checker and the plant helper,
      # and the link check over every tracked Markdown file. The identifier
      # check needs the owner's deny list, which CI does not hold
      # (docs/decisions/0015-PLAN-remediate-third-debugging-pass-findings.md R1).
      - name: Verify the gate and document tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./scripts/gate_test.sh
          ./scripts/check-docs_test.sh
          ./scripts/plant-copy_test.sh
          git ls-files -z '*.md' | xargs -0 ./scripts/check-docs.sh --links
      # The workflow checker parses YAML with PyYAML, which the runner image
      # does not ship; it is installed hash-pinned into a venv. Like the
      # release fixtures above it runs on Linux: its verdict depends on the
      # workflow text alone (docs/decisions/0004-PLAN-v1-0-1-defect-release.md
      # deviation D2). The shape test holds the publish workflow's archive
      # check in place (docs/decisions/0013-PLAN-build-and-stage-release-workflow.md B3).
      - name: Verify the workflow contract
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/wfcheck"
          "$RUNNER_TEMP/wfcheck/bin/pip" install --require-hashes --only-binary=:all: \
            -r scripts/requirements-workflow-check.txt
          export PATH="$RUNNER_TEMP/wfcheck/bin:$PATH"
          ./scripts/check-workflows.sh
          ./scripts/check-workflows.sh --rule expressions .github/workflows/ci.yml
          ./scripts/check-workflows.sh --rule permissions .github/workflows/ci.yml
          ./scripts/check-workflows.sh --rule pins .github/workflows/ci.yml
          ./scripts/check-workflows_test.sh
          ./scripts/workflow-shape_test.sh

  # install.sh under shells the runners lack: BusyBox ash, with BusyBox
  # wget, in Alpine (musl), and dash with curl in Debian. The releases are
  # staged on the runner, which has go and git; the static test binary then
  # runs in each image as the runner's user, since the installer refuses
  # root. Each run must reach its shell with stubs working
  # (docs/decisions/0014-PLAN-shared-installer-templates.md I3).
  installer-containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Stage the releases and build the test binary
        run: |
          SELFUPDATE_INSTALL_TEST_RELEASES="$RUNNER_TEMP/releases" \
            go test -count=1 -run '^TestInstallSh' ./internal/cmd/selfupdate-release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go test -c -o "$RUNNER_TEMP/selfupdate-release.test" ./internal/cmd/selfupdate-release
      - name: install.sh in Alpine
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP:/work:ro" \
            -e SELFUPDATE_INSTALL_TEST_RELEASES=/work/releases -e SELFUPDATE_INSTALL_REQUIRE_SHELLS=busybox \
            alpine:3.24.2@sha256:294b683cb724975bec92580e1e685676bd4b50bda910ddb8c51d4cabeaec77e6 \
            /work/selfupdate-release.test -test.run '^TestInstallSh' -test.count=1 -test.v
      - name: install.sh in Debian
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$RUNNER_TEMP:/work:ro" \
            -e SELFUPDATE_INSTALL_TEST_RELEASES=/work/releases -e SELFUPDATE_INSTALL_REQUIRE_SHELLS=dash,bash \
            buildpack-deps:trixie-curl@sha256:2145408a141dfcc7bb88b3089a62b22ebd29be69cbb9905e339f87e7d67bad8b \
            /work/selfupdate-release.test -test.run '^TestInstallSh' -test.count=1 -test.v

  # The build workflow, called by its local path on the fixture module: a
  # rehearsal on every branch and pull request, and a release build on a v*
  # tag, with the identity run on each platform's own runner. One call
  # stages raw binaries, the other archives
  # (docs/decisions/0013-PLAN-build-and-stage-release-workflow.md B4).
  release-rehearsal:
    uses: ./.github/workflows/build-selfupdate-release.yml
    with:
      spec-path: internal/cmd/selfupdate-release/testdata/fixture/selfupdate-release.json
      module-dir: internal/cmd/selfupdate-release/testdata/fixture
      artifact-name: fixture-binary-${{ github.sha }}-${{ github.run_attempt }}
      retention-days: 3

  release-rehearsal-archive:
    uses: ./.github/workflows/build-selfupdate-release.yml
    with:
      spec-path: internal/cmd/selfupdate-release/testdata/fixture/selfupdate-release.archive.json
      module-dir: internal/cmd/selfupdate-release/testdata/fixture
      artifact-name: fixture-archive-${{ github.sha }}-${{ github.run_attempt }}
      retention-days: 3

  # The hand-off, checked as the publish workflow checks it, without
  # publishing: the verifier on each staged set with the build workflow's
  # outputs, and the client's unpacker on the archives.
  release-rehearsal-check:
    needs: [release-rehearsal, release-rehearsal-archive]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.release-rehearsal.outputs.artifact-name }}
          path: ${{ runner.temp }}/binary
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.release-rehearsal-archive.outputs.artifact-name }}
          path: ${{ runner.temp }}/archive
      - name: Check the hand-off as the publish workflow would
        shell: bash
        env:
          TAG: ${{ needs.release-rehearsal.outputs.tag }}
          BIN_PRODUCTS: ${{ needs.release-rehearsal.outputs.products-json }}
          BIN_PLATFORMS: ${{ needs.release-rehearsal.outputs.platforms-json }}
          BIN_EXTRAS: ${{ needs.release-rehearsal.outputs.extra-assets-json }}
          BIN_CHANNELS: ${{ needs.release-rehearsal.outputs.prerelease-channels-json }}
          ARC_PRODUCTS: ${{ needs.release-rehearsal-archive.outputs.products-json }}
          ARC_PLATFORMS: ${{ needs.release-rehearsal-archive.outputs.platforms-json }}
          ARC_EXTRAS: ${{ needs.release-rehearsal-archive.outputs.extra-assets-json }}
          ARC_CHANNELS: ${{ needs.release-rehearsal-archive.outputs.prerelease-channels-json }}
        run: |
          set -euo pipefail
          tag=()
          if [ -n "$TAG" ]; then
            tag=(--tag "$TAG")
          fi
          out="$RUNNER_TEMP/verify-output"
          : >"$out"
          ./scripts/verify-selfupdate-release.sh --dir "$RUNNER_TEMP/binary" \
            --products "$BIN_PRODUCTS" --platforms "$BIN_PLATFORMS" \
            --extras "$BIN_EXTRAS" --channels "$BIN_CHANNELS" "${tag[@]}" \
            --github-output "$out"
          ./scripts/verify-selfupdate-release.sh --dir "$RUNNER_TEMP/archive" \
            --products "$ARC_PRODUCTS" --platforms "$ARC_PLATFORMS" \
            --extras "$ARC_EXTRAS" --channels "$ARC_CHANNELS" "${tag[@]}" \
            --github-output "$out"
          test "$(cat "$out")" = "$(printf 'packed=false\npacked=true')"
          go run ./internal/cmd/selfupdate-release check -dir "$RUNNER_TEMP/archive" \
            -products-json "$ARC_PRODUCTS" -platforms-json "$ARC_PLATFORMS"
      # Both staged sets carry the installers the fixture spec asks for,
      # rendered for this repository and the build's stamp, out of
      # SHA256SUMS, and lint clean as rendered. A rehearsal's stamp is no
      # release tag, so they are not run here; the live rehearsal runs them
      # (docs/decisions/0014-PLAN-shared-installer-templates.md I5, I7).
      - name: Check the staged installers
        shell: bash
        env:
          TAG: ${{ needs.release-rehearsal.outputs.tag }}
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          set -euo pipefail
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}:$PATH"
          stamp="${TAG:-rehearsal-${GITHUB_SHA:0:12}}"
          for set in binary archive; do
            ./scripts/check-installers.sh --staged "$RUNNER_TEMP/$set" \
              --repository "$GITHUB_REPOSITORY" --tag "$stamp"
          done
