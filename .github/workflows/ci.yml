name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# One run per ref: a newer push, or a duplicate trigger for the same one,
# cancels the older run
# (docs/decisions/0003-MADR-remediate-debugging-pass-findings.md D11).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      # The Linux leg fetches every commit and tag: the API gate compares
      # with the newest v1.* tag (0004-PLAN-v1-1-0-core-api.md Step 12).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ runner.os == 'Linux' && '0' || '1' }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: go mod download
      - run: go test ./...
      # The race detector needs cgo, which the Linux and macOS runners have
      # (0003-MADR D9; 0002-PLAN V3; 0004-MADR H7).
      # The manifest differential must run, not skip, where python3 is on
      # PATH; the Windows runner names it python
      # (0004-PLAN-h2-fuzzing-and-manifest-differential.md Step 3).
      - name: go test -race
        if: runner.os != 'Windows'
        env:
          SELFUPDATE_REQUIRE_PYTHON: "1"
        run: go test -race -count=1 ./...
      # Order-dependent tests fail here (0004-MADR H7).
      - name: go test -shuffle
        if: runner.os == 'Linux'
        run: go test -shuffle=on -count=2 ./...
      # Each fuzz target for 20 s; a failing input is kept as an artifact
      # (0004-PLAN-h2-fuzzing-and-manifest-differential.md Step 4).
      - name: fuzz
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./scripts/go-fuzz_test.sh
          make fuzz
      - name: fuzz corpus
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus
          path: selfupdate/testdata/fuzz/
          if-no-files-found: ignore
          retention-days: 14
      # Targets the matrix does not run: a build-tag gap fails here
      # (0004-MADR H7).
      - name: cross go vet
        if: runner.os == 'Linux'
        shell: bash
        run: |
          for target in freebsd/amd64 openbsd/amd64 linux/386; do
            echo "go vet ($target)"
            CGO_ENABLED=0 GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
          done
      - name: vet, gofmt, tidy, lint
        if: runner.os == 'Linux'
        run: |
          go vet ./...
          test -z "$(gofmt -l .)"
          go mod tidy -diff
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.14.0
          GOLANGCI_LINT="$(go env GOPATH)/bin/golangci-lint" make lint
      # apidiff exits 0 on an incompatible change, so the gate reads its
      # report; its own test plants a removal in a scratch clone. On a tag
      # push the base is that tag, which compares the tree with itself
      # (0004-PLAN-v1-1-0-core-api.md Step 12).
      - name: API compatibility
        if: runner.os == 'Linux'
        shell: bash
        run: |
          make apicheck
          ./scripts/check-api-compat_test.sh
      - name: govulncheck
        if: runner.os == 'Linux'
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...
      # Scripts, Markdown and workflows are checked as the pre-add gate and
      # the records require (0003-MADR D9).
      # shellcheck is pinned to the release the pre-add hosts use (the
      # latest), checksum-verified, and first on PATH so actionlint's
      # embedded checks use it too. The runner's distribution copy is older
      # and reports differently (0003-PLAN deviation D5).
      - name: shellcheck, markdownlint, actionlint
        if: runner.os == 'Linux'
        shell: bash
        env:
          SHELLCHECK_VERSION: v0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          export PATH="$RUNNER_TEMP/shellcheck-${SHELLCHECK_VERSION}:$PATH"
          shellcheck --version
          shellcheck scripts/*.sh
          npx --yes markdownlint-cli2@0.23.2
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      # The reusable release workflow's own tests
      # (docs/decisions/0002-MADR-rehome-selfupdate-from-mcplib.md §6).
      - name: verify self-update release fixtures
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/verify-selfupdate-release_test.sh
      - name: Verify the release guard
        shell: bash
        run: ./scripts/refuse-existing-release_test.sh
      # The release tag rule and the workflow's use of it
      # (docs/decisions/0005-PLAN-opt-in-prerelease-channels.md Step 6).
      - name: Verify the release tag rule
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/check-release-tag_test.sh
      # The release workflow's latest-flag rule: a backport below the current
      # latest is not made latest
      # (docs/decisions/0010-MADR-remediate-second-debugging-pass-findings.md D9).
      - name: Verify the latest-release rule
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/release-latest-flag_test.sh
      # The pre-add gate's own test: a deletion still checks its package, and
      # an unreachable vulnerability database fails
      # (docs/decisions/0010-MADR-remediate-second-debugging-pass-findings.md D3, D4).
      - name: Verify the pre-add gate
        if: runner.os == 'Linux'
        shell: bash
        run: ./scripts/go-precheck_test.sh
      # The workflow checker parses YAML with PyYAML, which the runner image
      # does not ship; it is installed hash-pinned into a venv. Like the
      # release fixtures above it runs on Linux: its verdict depends on the
      # workflow text alone (docs/decisions/0004-PLAN-v1-0-1-defect-release.md
      # deviation D2).
      - name: Verify the workflow contract
        if: runner.os == 'Linux'
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/wfcheck"
          "$RUNNER_TEMP/wfcheck/bin/pip" install --require-hashes --only-binary=:all: \
            -r scripts/requirements-workflow-check.txt
          export PATH="$RUNNER_TEMP/wfcheck/bin:$PATH"
          ./scripts/check-workflows.sh
          ./scripts/check-workflows.sh --rule expressions .github/workflows/ci.yml
          ./scripts/check-workflows_test.sh
