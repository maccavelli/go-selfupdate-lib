name: Docs

# Checks a change to Markdown alone, which ci.yml skips: markdownlint, the
# records and their index, the link check over every tracked Markdown file,
# the architecture table, and the home-path check over every tracked file,
# through the make targets ci.yml's validate job runs for them. A change to
# anything else runs ci.yml, and so does every tag
# (docs/decisions/0028-MADR-skip-full-ci-for-docs-only-pushes.md;
# docs/decisions/0036-MADR-align-docs-ci-and-disclosure-gates.md A1 G1).
on:
  push:
    branches: [main, 'release/**']
    paths: ['**.md', '.markdownlint-cli2.jsonc', '.github/workflows/docs.yml']
  pull_request:
    paths: ['**.md', '.markdownlint-cli2.jsonc', '.github/workflows/docs.yml']

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: markdownlint
        run: make markdownlint
      - name: records and index
        run: make check-records
      - name: links and architecture table
        run: make docs-check
      - name: home paths
        run: make disclosure-check
