name: Docs

# Checks a change to Markdown alone, which ci.yml skips: markdownlint, the
# link check over every tracked Markdown file, and the architecture table
# check, with the commands ci.yml's validate job runs for them. A change to
# anything else runs ci.yml, and so does every tag
# (docs/decisions/0028-MADR-skip-full-ci-for-docs-only-pushes.md).
on:
  push:
    branches: [main, 'release/**']
    paths: ['**.md', '.markdownlint-cli2.jsonc', '.github/workflows/docs.yml']
  pull_request:
    paths: ['**.md', '.markdownlint-cli2.jsonc', '.github/workflows/docs.yml']

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: markdownlint
        run: npx --yes markdownlint-cli2@0.23.2
      - name: links
        shell: bash
        run: git ls-files -z '*.md' | xargs -0 ./scripts/check-docs.sh --links
      - name: architecture table
        shell: bash
        run: ./scripts/check-docs.sh --arch docs/architecture.md
