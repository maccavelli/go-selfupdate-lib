name: Build self-update release

# Builds, checks, packs and stages a self-update release from the caller's
# release spec, and uploads it for publish-selfupdate-release.yml
# (docs/decisions/0013-MADR-build-and-stage-release-workflow.md §4–§7). On
# a tag it builds the release; on any other ref it rehearses, stamped local,
# so the recipe runs on every change. It publishes nothing, attests nothing
# and needs no write permission. Its outputs are the publish workflow's
# inputs.
on:
  workflow_call:
    inputs:
      spec-path:
        description: The release spec, relative to the repository root
        required: true
        type: string
      module-dir:
        description: The Go module, relative to the repository root
        required: false
        type: string
        default: '.'
      extras-artifact-name:
        description: >-
          An artifact of this run holding the spec's extras that have no
          path; empty when there are none
        required: false
        type: string
        default: ''
      artifact-name:
        description: The staged artifact's name; empty for the default
        required: false
        type: string
        default: ''
      retention-days:
        description: The staged artifact's retention, in days
        required: false
        type: number
        default: 7
    outputs:
      artifact-name:
        description: The staged release artifact
        value: ${{ jobs.build.outputs.artifact-name }}
      tag:
        description: The release tag; empty in a rehearsal
        value: ${{ jobs.build.outputs.tag }}
      rehearsal:
        description: "'true' off a tag, 'false' on one"
        value: ${{ jobs.build.outputs.rehearsal }}
      products-json:
        description: The publish workflow's products-json
        value: ${{ jobs.build.outputs.products-json }}
      platforms-json:
        description: The publish workflow's platforms-json
        value: ${{ jobs.build.outputs.platforms-json }}
      extra-assets-json:
        description: The publish workflow's extra-assets-json
        value: ${{ jobs.build.outputs.extra-assets-json }}
      prerelease-channels-json:
        description: The publish workflow's prerelease-channels-json
        value: ${{ jobs.build.outputs.prerelease-channels-json }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      artifact-name: ${{ steps.plan.outputs.artifact-name }}
      tag: ${{ steps.plan.outputs.tag }}
      rehearsal: ${{ steps.plan.outputs.rehearsal }}
      stamp-version: ${{ steps.plan.outputs.stamp-version }}
      stamp-kind: ${{ steps.plan.outputs.stamp-kind }}
      products-json: ${{ steps.plan.outputs.products-json }}
      platforms-json: ${{ steps.plan.outputs.platforms-json }}
      extra-assets-json: ${{ steps.plan.outputs.extra-assets-json }}
      prerelease-channels-json: ${{ steps.plan.outputs.prerelease-channels-json }}
      identity-matrix: ${{ steps.plan.outputs.identity-matrix }}
    steps:
      # The tools come from the called workflow's own commit, as in the
      # publish workflow. fromJSON(toJSON(job)) is required because
      # actionlint v1.7.12's job type does not yet list these fields.
      - name: Check out the called workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          persist-credentials: false
          path: tools

      # The caller's source, at the event's ref, beside the tools and not
      # under them: anything untracked in it would stamp the build dirty
      # (0013-MADR §4). On a tag the checkout holds the tag, from which Go
      # stamps the main module's version.
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: src

      # The caller's toolchain, with no cache: a release build restores
      # nothing another ref wrote.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: src/${{ inputs.module-dir }}/go.mod
          cache: false

      - name: Build the release tool
        shell: bash
        working-directory: tools
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/tool/selfupdate-release" ./internal/cmd/selfupdate-release

      # Every run block reads its values through env, never through an
      # interpolated expression (docs/decisions/0003-MADR-remediate-debugging-pass-findings.md D8).
      - name: Plan
        id: plan
        shell: bash
        env:
          SPEC_PATH: ${{ inputs.spec-path }}
          ARTIFACT_NAME: ${{ inputs.artifact-name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tool/selfupdate-release" plan \
            -spec "src/$SPEC_PATH" \
            -ref-type "$REF_TYPE" \
            -ref-name "$REF_NAME" \
            -sha "$SHA" \
            -run-attempt "$RUN_ATTEMPT" \
            -artifact-name "$ARTIFACT_NAME" \
            -github-output "$GITHUB_OUTPUT" \
            -summary "$GITHUB_STEP_SUMMARY"

      # The publish workflow's own tag rule, run here first, so a tag it
      # would refuse is refused before anything is built.
      - name: Require an admitted tag
        if: steps.plan.outputs.rehearsal == 'false'
        shell: bash
        env:
          TAG: ${{ steps.plan.outputs.tag }}
          CHANNELS_JSON: ${{ steps.plan.outputs.prerelease-channels-json }}
        run: |
          set -euo pipefail
          sh tools/scripts/check-release-tag.sh "$TAG" "$CHANNELS_JSON"

      - name: Download the extras
        if: inputs.extras-artifact-name != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.extras-artifact-name }}
          path: ${{ runner.temp }}/extras

      - name: Build
        shell: bash
        env:
          SPEC_PATH: ${{ inputs.spec-path }}
          MODULE_DIR: ${{ inputs.module-dir }}
          STAMP_VERSION: ${{ steps.plan.outputs.stamp-version }}
          STAMP_KIND: ${{ steps.plan.outputs.stamp-kind }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/tool/selfupdate-release" build \
            -spec "src/$SPEC_PATH" \
            -module-dir "src/$MODULE_DIR" \
            -stamp-version "$STAMP_VERSION" \
            -stamp-kind "$STAMP_KIND" \
            -out "$RUNNER_TEMP/bin"

      - name: Check, pack and stage
        shell: bash
        env:
          SPEC_PATH: ${{ inputs.spec-path }}
          MODULE_DIR: ${{ inputs.module-dir }}
          EXTRAS_ARTIFACT: ${{ inputs.extras-artifact-name }}
          SHA: ${{ github.sha }}
          TAG: ${{ steps.plan.outputs.tag }}
          STAMP_VERSION: ${{ steps.plan.outputs.stamp-version }}
        run: |
          set -euo pipefail
          extras=()
          if [ -n "$EXTRAS_ARTIFACT" ]; then
            extras=(-extras-dir "$RUNNER_TEMP/extras")
          fi
          "$RUNNER_TEMP/tool/selfupdate-release" stage \
            -spec "src/$SPEC_PATH" \
            -module-dir "src/$MODULE_DIR" \
            -src src \
            -bin "$RUNNER_TEMP/bin" \
            -out "$RUNNER_TEMP/staging" \
            -sha "$SHA" \
            -tag "$TAG" \
            -stamp-version "$STAMP_VERSION" \
            "${extras[@]}" \
            -summary "$GITHUB_STEP_SUMMARY"

      # The publish workflow's verifier, on the same set, so a release this
      # workflow stages is one that workflow accepts.
      - name: Verify the staged release
        shell: bash
        env:
          PRODUCTS_JSON: ${{ steps.plan.outputs.products-json }}
          PLATFORMS_JSON: ${{ steps.plan.outputs.platforms-json }}
          EXTRAS_JSON: ${{ steps.plan.outputs.extra-assets-json }}
          CHANNELS_JSON: ${{ steps.plan.outputs.prerelease-channels-json }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          set -euo pipefail
          args=(--dir "$RUNNER_TEMP/staging" --products "$PRODUCTS_JSON" \
            --platforms "$PLATFORMS_JSON" --extras "$EXTRAS_JSON")
          if [ -n "$TAG" ]; then
            args+=(--tag "$TAG" --channels "$CHANNELS_JSON")
          fi
          sh tools/scripts/verify-selfupdate-release.sh "${args[@]}"

      # The identity job runs on each platform's own runner, which has no Go
      # set up, so the tool is cross-compiled for each.
      - name: Build the release tool for the identity runners
        shell: bash
        working-directory: tools
        env:
          TOOL_TARGETS: ${{ steps.plan.outputs.tool-targets }}
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tools-out"
          python3 -c 'import json, os; print("\n".join(json.loads(os.environ["TOOL_TARGETS"])))' |
            while IFS=/ read -r goos goarch; do
              [ -n "$goos" ] || continue
              out="$RUNNER_TEMP/tools-out/selfupdate-release-$goos-$goarch"
              if [ "$goos" = windows ]; then
                out="$out.exe"
              fi
              GOOS="$goos" GOARCH="$goarch" go build -o "$out" ./internal/cmd/selfupdate-release
            done

      - name: Upload the staged release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plan.outputs.artifact-name }}
          path: ${{ runner.temp }}/staging/
          if-no-files-found: error
          retention-days: ${{ inputs.retention-days }}

      - name: Upload the release tool
        if: steps.plan.outputs.tool-targets != '[]'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.plan.outputs.artifact-name }}-tools
          path: ${{ runner.temp }}/tools-out/
          if-no-files-found: error
          retention-days: 1

  # Layer 3 of 0013-MADR §5: each staged program, on its own platform's
  # runner, must report the stamp it was built with.
  identity:
    needs: build
    if: needs.build.outputs.identity-matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.build.outputs.identity-matrix) }}
    name: identity (${{ matrix.product }}, ${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - name: Download the staged release
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: staging

      - name: Download the release tool
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.artifact-name }}-tools
          path: tool

      - name: Run the program's identity command
        shell: bash
        env:
          PRODUCT: ${{ matrix.product }}
          GOOS_NAME: ${{ matrix.os }}
          GOARCH_NAME: ${{ matrix.arch }}
          ASSET: ${{ matrix.asset }}
          ARGS_JSON: ${{ matrix.args }}
          WANT_VERSION: ${{ needs.build.outputs.stamp-version }}
          WANT_KIND: ${{ needs.build.outputs.stamp-kind }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tool="tool/selfupdate-release-$GOOS_NAME-$GOARCH_NAME"
          if [ "$GOOS_NAME" = windows ]; then
            tool="$tool.exe"
          fi
          # Artifacts do not keep file modes.
          chmod +x "$tool"
          "$tool" identity \
            -staging staging \
            -asset "$ASSET" \
            -product "$PRODUCT" \
            -os "$GOOS_NAME" \
            -arch "$GOARCH_NAME" \
            -args-json "$ARGS_JSON" \
            -want-version "$WANT_VERSION" \
            -want-kind "$WANT_KIND" \
            -sha "$SHA"
