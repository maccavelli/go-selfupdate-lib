name: Publish self-update release

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Caller artifact containing the complete staged release
        required: true
        type: string
      products-json:
        description: JSON array of exact product basenames
        required: true
        type: string
      platforms-json:
        description: JSON array of objects with only os and arch
        required: true
        type: string
      extra-assets-json:
        description: JSON array of extra basenames; [] means none
        required: true
        type: string
      prerelease-channels-json:
        description: >-
          JSON array of prerelease channel names, most stable first, in
          descending ASCII order, such as ["rc","beta"]; a tag
          vX.Y.Z-NAME.N publishes as a prerelease only when NAME is listed.
          [] publishes stable tags only
        required: false
        type: string
        default: '[]'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Check gh release capabilities
        shell: bash
        # No GH_REPO here on purpose: these read gh's own help and version,
        # which resolve no repository. Every OTHER gh step in this workflow
        # needs it, because the job never checks the calling repository out
        # at top level. --help exits 0 for any subcommand or field, so the
        # help text is parsed instead. gh 2.76.0 added the immutable field to
        # release view, and 2.81.0 added release verify
        # (docs/decisions/0010-MADR-remediate-second-debugging-pass-findings.md D5).
        run: |
          set -euo pipefail
          release_help=$(gh release --help)
          grep -qE '^[[:space:]]+verify:' <<<"$release_help" || {
            echo "publish-selfupdate-release: this gh has no 'release verify'" >&2
            exit 1
          }
          view_help=$(gh release view --help)
          grep -qw isImmutable <<<"$view_help" || {
            echo "publish-selfupdate-release: this gh's release view has no isImmutable" >&2
            exit 1
          }
          min=2.81.0
          have=$(gh --version | sed -n 's/^gh version \([0-9.]*\).*/\1/p')
          if [ "$(printf '%s\n%s\n' "$min" "$have" | sort -V | head -n 1)" != "$min" ]; then
            echo "publish-selfupdate-release: gh $have is older than $min" >&2
            exit 1
          fi

      - name: Check out the called workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # job.workflow_repository / job.workflow_sha identify the called
          # workflow commit. fromJSON(toJSON(job)) is required because
          # actionlint v1.7.12's job type does not yet list those fields.
          repository: ${{ fromJSON(toJSON(job)).workflow_repository }}
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          persist-credentials: false
          path: .core-lib-release-tools

      # Every run block reads the ref through env, never through an
      # interpolated ${{ }}: a tag name is attacker-chosen text, and
      # interpolation would paste it into the script before any check
      # (docs/decisions/0003-MADR-remediate-debugging-pass-findings.md D8).
      # It runs after the tools checkout, which holds the tag rule, and
      # before anything reads the artifact or mutates a release. The rule
      # mirrors selfupdate.NewSemverPolicy
      # (docs/decisions/0005-MADR-opt-in-prerelease-channels.md §5, E4).
      - name: Require an admitted tag
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
          CHANNELS_JSON: ${{ inputs.prerelease-channels-json }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" != "tag" ]; then
            echo "publish-selfupdate-release: ref is not a tag" >&2
            exit 1
          fi
          sh .core-lib-release-tools/scripts/check-release-tag.sh "$TAG" "$CHANNELS_JSON"

      # Runs AFTER the tools checkout so it can call the shared script, and
      # still BEFORE the artifact download and any release mutation. The logic
      # lives in a script so its three outcomes are testable with a stubbed gh
      # (mcplib docs/0007-MADR-restore-repository-context-in-the-reusable-release-workflow.md);
      # an inline copy would drift from the tested one.
      - name: Refuse an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x .core-lib-release-tools/scripts/refuse-existing-release.sh
          .core-lib-release-tools/scripts/refuse-existing-release.sh "$TAG"

      # No checkout of the CALLING repository is added here. actions/checkout
      # defaults to clean: true, which removes untracked files, and staging/
      # holds the downloaded, validated release assets. gh resolves the
      # repository from GH_REPO instead
      # (mcplib docs/0007-MADR-restore-repository-context-in-the-reusable-release-workflow.md).
      - name: Download the staged release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: staging

      - name: Validate the staged file set
        shell: bash
        env:
          PRODUCTS_JSON: ${{ inputs.products-json }}
          PLATFORMS_JSON: ${{ inputs.platforms-json }}
          EXTRAS_JSON: ${{ inputs.extra-assets-json }}
          CHANNELS_JSON: ${{ inputs.prerelease-channels-json }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          chmod +x .core-lib-release-tools/scripts/verify-selfupdate-release.sh
          .core-lib-release-tools/scripts/verify-selfupdate-release.sh \
            --dir staging \
            --products "$PRODUCTS_JSON" \
            --platforms "$PLATFORMS_JSON" \
            --extras "$EXTRAS_JSON" \
            --channels "$CHANNELS_JSON" \
            --tag "$TAG"

      - name: Create a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A suffixed tag passed the channel check above. It is created as
          # a prerelease that can never become the repository's latest
          # release, which stable clients read (0005-MADR §5). A stable tag
          # lower than the current latest, a backport, is not made latest
          # either (0010-MADR D9).
          args=(--draft --verify-tag --generate-notes)
          case "$TAG" in
          *-*) args+=(--prerelease --latest=false) ;;
          esac
          latest_flag=""
          case "$TAG" in
          *-*) ;;
          *) latest_flag=$(sh .core-lib-release-tools/scripts/release-latest-flag.sh "$TAG") ;;
          esac
          if [ -n "$latest_flag" ]; then
            args+=("$latest_flag")
            echo "$TAG is lower than the current latest release; it is published with $latest_flag." >>"$GITHUB_STEP_SUMMARY"
          fi
          gh release create "$TAG" "${args[@]}"
          # Upload the explicit validated file list, one argument per file
          # (0003-MADR D5). --clobber is forbidden.
          files=()
          while IFS= read -r -d '' f; do
            files+=("$f")
          done < <(find staging -type f -print0 | sort -z)
          gh release upload "$TAG" "${files[@]}"

      - name: Attest the staged files
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: staging/*

      - name: Publish the draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Publication is where GitHub picks the latest release, so the
          # flag from the create step is applied again here (0010-MADR D9).
          args=(--draft=false)
          case "$TAG" in
          *-*) ;;
          *)
            latest_flag=$(sh .core-lib-release-tools/scripts/release-latest-flag.sh "$TAG")
            if [ -n "$latest_flag" ]; then
              args+=("$latest_flag")
            fi
            ;;
          esac
          gh release edit "$TAG" "${args[@]}"

      - name: Wait for immutability and release attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          tag="$TAG"
          deadline=$((SECONDS + 120))
          while [ "$SECONDS" -lt "$deadline" ]; do
            immutable=$(gh release view "$tag" --json isImmutable --jq .isImmutable || true)
            if [ "$immutable" = "true" ] && gh release verify "$tag"; then
              echo "publish-selfupdate-release: $tag is immutable and verified"
              exit 0
            fi
            sleep 5
          done
          echo "publish-selfupdate-release: timed out waiting for immutability of $tag" >&2
          exit 1
