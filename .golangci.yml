version: "2"
run:
  tests: true
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - errcheck
    - errorlint
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - makezero
    - misspell
    - nakedret
    - nilerr
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - whitespace
  settings:
    # The module's import rules
    # (docs/decisions/0008-MADR-enforce-import-rules-with-depguard.md).
    depguard:
      rules:
        # golangci-lint keeps one finding per line, the first rule's by name,
        # so "banned" must sort before every other rule: a banned module is
        # then always refused with its reason. Name new rules to sort after it
        # (docs/decisions/0008-PLAN-enforce-import-rules-with-depguard.md,
        # deviation D1).
        banned:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: github.com/maccavelli/mcplib
              desc: "this module never imports mcplib (AGENTS.md, Dependencies)"
            - pkg: github.com/modelcontextprotocol/go-sdk
              desc: "this module never imports the MCP go-sdk (AGENTS.md, Dependencies)"
            - pkg: github.com/maccavelli/go-llmprovider-sdk
              desc: "this module never imports go-llmprovider-sdk (AGENTS.md, Dependencies)"
            - pkg: charm.land
              desc: "Charm lives in go-tui-lib, not here (0004-MADR, Decision Outcome)"
            - pkg: github.com/charmbracelet
              desc: "Charm lives in go-tui-lib, not here (0004-MADR, Decision Outcome)"
        module:
          list-mode: strict
          files:
            - $all
          allow:
            - $gostd
            - github.com/maccavelli/go-selfupdate-lib
            - golang.org/x/mod
            - golang.org/x/sys
            - golang.org/x/term
        buildinfo:
          list-mode: strict
          files:
            - "**/buildinfo/*.go"
            - "!$test"
          allow:
            - $gostd
        selfupdate:
          list-mode: strict
          files:
            - "**/selfupdate/*.go"
            - "!$test"
          allow:
            - $gostd
            - golang.org/x/mod/semver
            - golang.org/x/sys
            - golang.org/x/term
        selfupdate-cli:
          list-mode: strict
          files:
            - "**/selfupdate/cli/*.go"
            - "!$test"
          allow:
            - $gostd
            - golang.org/x/term
            - github.com/maccavelli/go-selfupdate-lib/selfupdate$
            - github.com/maccavelli/go-selfupdate-lib/buildinfo$
        selfupdatetest:
          list-mode: strict
          files:
            - "**/selfupdate/selfupdatetest/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/maccavelli/go-selfupdate-lib/selfupdate$
        # selfupdate/service and its three backends: the standard library,
        # x/sys only where Windows needs it, and the module's own packages
        # (docs/decisions/0011-MADR-reference-service-lifecycles.md §1).
        service:
          list-mode: strict
          files:
            - "**/selfupdate/service/*.go"
            - "!$test"
          allow:
            - $gostd
            - golang.org/x/sys/windows$
            - github.com/maccavelli/go-selfupdate-lib/selfupdate$
        service-launchd:
          list-mode: strict
          files:
            - "**/selfupdate/service/launchd/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/maccavelli/go-selfupdate-lib/selfupdate$
            - github.com/maccavelli/go-selfupdate-lib/selfupdate/service$
        service-scm:
          list-mode: strict
          files:
            - "**/selfupdate/service/scm/*.go"
            - "!$test"
          allow:
            - $gostd
            - golang.org/x/sys/windows$
            - golang.org/x/sys/windows/svc$
            - golang.org/x/sys/windows/svc/mgr$
            - github.com/maccavelli/go-selfupdate-lib/selfupdate$
            - github.com/maccavelli/go-selfupdate-lib/selfupdate/service$
        service-systemd:
          list-mode: strict
          files:
            - "**/selfupdate/service/systemd/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/maccavelli/go-selfupdate-lib/selfupdate$
            - github.com/maccavelli/go-selfupdate-lib/selfupdate/service$
        # selfupdate/archive: the standard library and selfupdate
        # (docs/decisions/0012-MADR-archive-assets-and-macos-codesign.md §1).
        # Named after the package's path, since "archive" would sort before
        # "banned" (0008-MADR D1).
        selfupdate-archive:
          list-mode: strict
          files:
            - "**/selfupdate/archive/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/maccavelli/go-selfupdate-lib/selfupdate$
        # Every other package, such as a new internal/ helper, gets only the
        # standard library and this module until a record gives it its own
        # rule (docs/decisions/0010-MADR-remediate-second-debugging-pass-findings.md
        # D13). The globs above are excluded here, so each named package keeps
        # exactly its own rule.
        other-packages:
          list-mode: strict
          files:
            - $all
            - "!$test"
            - "!**/buildinfo/*.go"
            - "!**/selfupdate/*.go"
            - "!**/selfupdate/cli/*.go"
            - "!**/selfupdate/selfupdatetest/*.go"
            - "!**/selfupdate/service/*.go"
            - "!**/selfupdate/service/launchd/*.go"
            - "!**/selfupdate/service/scm/*.go"
            - "!**/selfupdate/service/systemd/*.go"
            - "!**/selfupdate/archive/*.go"
          allow:
            - $gostd
            - github.com/maccavelli/go-selfupdate-lib
    errcheck:
      check-type-assertions: true
      check-blank: true
    gocognit:
      min-complexity: 50
    gocritic:
      disabled-checks:
        - paramTypeCombine
        - unnamedResult
        - exitAfterDefer
        - octalLiteral
        - hugeParam
        - rangeValCopy
        - ifElseChain
        - elseif
      enabled-tags:
        - diagnostic
        - style
        - performance
    gocyclo:
      min-complexity: 40
    gosec:
      excludes:
        - G104
    revive:
      rules:
        - name: atomic
        - name: blank-imports
        - name: confusing-naming
        - name: constant-logical-expr
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: receiver-naming
        - name: redefines-builtin-id
        - name: superfluous-else
        - name: time-naming
        - name: unexported-return
        - name: unreachable-code
        - name: var-declaration
        - name: exported
        - name: package-comments
        - name: var-naming
  exclusions:
    generated: lax
    rules:
      - linters:
          - errcheck
          - gosec
          - unparam
          - revive
          - gocritic
          - goconst
        path: _test\.go
      - linters:
          - godot
        text: Comment should end in a period
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
